# Kuuma — the one place every tool and library version is pinned.
#
# Language-specific manifests (gradle/libs.versions.toml, pubspec.yaml files,
# pyproject.toml files, package.json files) must agree with this file.
# `make check` runs tools/check_versions.py, which fails on any mismatch.

[toolchains]
java = "17"                # minimum JDK for Gradle/AGP; newer JDKs work
gradle = "8.14.3"
kotlin = "2.2.0"
android-gradle-plugin = "8.10.1"
android-compile-sdk = "35"
android-min-sdk = "21"     # Android 5.0 — oldest Flutter supports
android-target-sdk = "35"
flutter = "3.27.4"
dart = "3.6.2"
python = "3.12"
uv = "0.13.7"
node = "22"
pnpm = "9.15.0"

[kotlin]
kotlinx-serialization = "1.8.1"
kotlinx-coroutines = "1.10.2"
androidx-core = "1.13.1"
sqlcipher-android = "4.6.1"
androidx-sqlite = "2.4.0"
lint = "31.10.1"           # = AGP version + 23.0.0
junit = "4.13.2"
json-schema-validator = "1.5.6"
ktlint = "1.5.0"
ktlint-gradle = "12.1.2"

[dart]
melos = "6.3.2"
flutter-lints = "5.0.0"
intl = "0.19.0"
local-auth = "2.3.0"
yaml = "3.1.3"
json-schema = "5.2.0"

[python]
fastapi = "0.115.12"
uvicorn = "0.34.2"
pydantic = "2.11.4"
sqlalchemy = "2.0.40"
alembic = "1.15.2"
psycopg = "3.2.9"
redis = "5.2.1"
cryptography = "44.0.3"
prometheus-client = "0.21.1"
pyyaml = "6.0.2"
jsonschema = "4.23.0"
httpx = "0.28.1"
pytest = "8.3.5"
ruff = "0.11.10"
pre-commit = "4.2.0"

[node]
typescript = "5.8.3"
ajv = "8.17.1"
ajv-formats = "3.0.1"
eslint = "9.27.0"
typescript-eslint = "8.32.1"
prettier = "3.5.3"
vitest = "3.1.4"

[images]
postgres = "postgres:16.9-alpine"
redis = "redis:7.4.3-alpine"
minio = "minio/minio:RELEASE.2025-04-22T22-12-26Z"
nginx = "nginx:1.27.5-alpine"
python = "python:3.12.10-slim"
