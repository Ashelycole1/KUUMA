plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "ug.kuuma.child"
    compileSdk = 35

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = "11"
    }

    buildFeatures {
        buildConfig = true
    }

    defaultConfig {
        applicationId = "ug.kuuma.child"
        minSdk = 21 // Android 5.0: support as many phones as possible
        targetSdk = 35
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        multiDexEnabled = true
    }

    buildTypes {
        debug {
            // Debug APKs are signed with the shared debug key from infra/keys (see `make apk`),
            // or the machine's own debug key if that is absent.
        }
        release {
            // No release signing yet: releases are built by CI once a store key exists.
            signingConfig = signingConfigs.debug
        }
    }

    def sharedDebugKey = rootProject.file("../../../infra/keys/kuuma-debug.keystore")
    if (sharedDebugKey.exists()) {
        signingConfigs.debug.storeFile = sharedDebugKey
        signingConfigs.debug.storePassword = "android"
        signingConfigs.debug.keyAlias = "androiddebugkey"
        signingConfigs.debug.keyPassword = "android"
    }
}

flutter {
    source = "../.."
}

dependencies {
    implementation "ug.kuuma:core-android:0.1.0"
    implementation "ug.kuuma:ai-runtime-android:0.1.0"
    implementation "ug.kuuma:sentinel:0.1.0"
    implementation "ug.kuuma:companion:0.1.0"
    implementation "ug.kuuma:casefile:0.1.0"
    implementation "ug.kuuma:guardian:0.1.0"
    debugImplementation "ug.kuuma:fakes:0.1.0"
}
