pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

// Versions must match gradle/libs.versions.toml at the repo root (tools/check_versions.py checks).
plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.10.1" apply false
    id "org.jetbrains.kotlin.android" version "2.2.0" apply false
}

include ":app"

// The monorepo's Kotlin build: core-android, the module libraries, ai-runtime-android, fakes.
// Dependencies on ug.kuuma:<project> resolve to these projects from source.
includeBuild("../../..")
