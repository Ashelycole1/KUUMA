name: kuuma_parent_app
description: Kuuma parent app shell. Core-owned; Guardian's screens plug in through kuuma_ui slots.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  kuuma_ui:
    path: ../../packages/ui
  kuuma_guardian:
    path: ../../modules/guardian/flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 5.0.0

flutter:
  uses-material-design: true
