plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "ug.kuuma.parent"
    compileSdk = 35

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = "11"
    }

    defaultConfig {
        applicationId = "ug.kuuma.parent"
        minSdk = 21
        targetSdk = 35
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            // No release signing yet: releases are built by CI once a store key exists.
            signingConfig = signingConfigs.debug
        }
    }

    def sharedDebugKey = rootProject.file("../../../infra/keys/kuuma-debug.keystore")
    if (sharedDebugKey.exists()) {
        signingConfigs.debug.storeFile = sharedDebugKey
        signingConfigs.debug.storePassword = "android"
        signingConfigs.debug.keyAlias = "androiddebugkey"
        signingConfigs.debug.keyPassword = "android"
    }
}

flutter {
    source = "../.."
}
