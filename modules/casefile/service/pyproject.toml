[project]
name = "kuuma-casefile-service"
version = "0.1.0"
description = "Kuuma Casefile service. Timestamps, encrypted bundle slots, expiring shares and verification."
requires-python = ">=3.12"
dependencies = ["kuuma-server-common", "kuuma-contracts", "minio==7.2.15"]

[tool.uv.sources]
kuuma-server-common = { workspace = true }
kuuma-contracts = { workspace = true }

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kuuma_casefile_service"]
