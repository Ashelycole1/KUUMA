name: kuuma_guardian
description: Guardian screens for the Kuuma apps - the parent app and the child's setup wizard.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

# Rule 1: shared packages only (kuuma_ui, kuuma_contracts, kuuma_lang), never another module.
dependencies:
  flutter:
    sdk: flutter
  kuuma_ui:
    path: ../../../packages/ui
  kuuma_contracts:
    path: ../../../packages/contracts/generated/dart
  kuuma_lang:
    path: ../../../packages/lang/dart
  # Exact pins: family-key crypto (HMAC-SHA256, AES-256-GCM, P-256), parent API, pairing QR, key storage.
  crypto: 3.0.6
  pointycastle: 3.9.1
  http: 1.2.2
  qr_flutter: 4.1.0
  mobile_scanner: 5.2.3
  flutter_secure_storage: 9.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 5.0.0
