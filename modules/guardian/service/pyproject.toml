[project]
name = "kuuma-guardian-service"
version = "0.1.0"
description = "Nilinde Guardian service. Skeleton from Core; the Guardian owner fills it."
requires-python = ">=3.12"
dependencies = ["kuuma-server-common", "kuuma-contracts"]

[tool.uv.sources]
kuuma-server-common = { workspace = true }
kuuma-contracts = { workspace = true }

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kuuma_guardian_service"]
