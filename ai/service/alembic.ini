# Alembic for the `ai` schema only. Run: make migrate (or `uv run alembic -c ai/service/alembic.ini upgrade head`)
[alembic]
script_location = %(here)s/migrations
version_locations = %(here)s/migrations/versions

[loggers]
keys = root
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARNING
handlers = console
[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic
[formatter_generic]
format = %(levelname)s %(name)s %(message)s
