# Kuuma API gateway (local stack). Routes each API prefix to its service, stamps request
# ids and applies rate limits. Logs are content-free: no query strings, no bodies, no
# user agents (rule 7).

worker_processes auto;
events { worker_connections 1024; }

http {
    # Request ids: keep a well-formed incoming id, otherwise mint one.
    map $http_x_request_id $kuuma_request_id {
        "~^req-[A-Za-z0-9-]{1,64}$" $http_x_request_id;
        default                     "req-$request_id";
    }

    # Content-free access log: method, path, status, timing, request id. Never $args or $request.
    log_format kuuma escape=json
        '{"ts":"$time_iso8601","service":"gateway","event":"http.request","method":"$request_method",'
        '"route":"$uri","status":$status,"took_ms":$request_time,"request_id":"$kuuma_request_id"}';
    access_log /dev/stdout kuuma;
    error_log /dev/stderr warn;

    # Rate limits (PLACEHOLDER values until we have real traffic).
    limit_req_zone $binary_remote_addr     zone=per_ip:10m     rate=20r/s;
    limit_req_zone $http_x_kuuma_device_id zone=per_device:10m rate=5r/s;
    limit_req_zone $binary_remote_addr     zone=verify:10m     rate=2r/s;
    limit_req_status 429;

    client_max_body_size 1m;
    server_tokens off;

    upstream ai        { server ai:8000; }
    upstream companion { server companion:8000; }
    upstream casefile  { server casefile:8000; }
    upstream guardian  { server guardian:8000; }

    server {
        listen 8080;

        proxy_set_header X-Request-ID $kuuma_request_id;
        proxy_set_header Host $host;
        add_header X-Request-ID $kuuma_request_id always;
        proxy_http_version 1.1;

        location = /healthz {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok","service":"gateway"}';
        }

        location /v1/ai/ {
            limit_req zone=per_ip burst=40 nodelay;
            limit_req zone=per_device burst=10 nodelay;
            proxy_pass http://ai;
        }
        location /v1/companion/ {
            limit_req zone=per_ip burst=40 nodelay;
            limit_req zone=per_device burst=10 nodelay;
            proxy_pass http://companion;
        }
        location /v1/cases/ {
            limit_req zone=per_ip burst=40 nodelay;
            limit_req zone=per_device burst=10 nodelay;
            proxy_pass http://casefile;
        }
        # Public: recipients verify evidence hashes without an account.
        location /v1/verify/ {
            limit_req zone=verify burst=10 nodelay;
            proxy_pass http://casefile;
        }
        location /v1/guardian/ {
            limit_req zone=per_ip burst=40 nodelay;
            limit_req zone=per_device burst=10 nodelay;
            proxy_pass http://guardian;
        }

        location / {
            default_type application/json;
            return 404 '{"error":{"code":"not_found","message":"No such API prefix","requestId":"$kuuma_request_id"}}';
        }
    }
}
