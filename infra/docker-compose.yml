# Kuuma local stack: `make dev`. Everything runs on this laptop with stubs and fakes.
# Secrets come from the git-ignored .env at the repo root (copy .env.example).
name: kuuma

x-service: &service
  build:
    context: ..
    dockerfile: infra/docker/service.Dockerfile
  image: kuuma-service:local
  restart: unless-stopped
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
  env_file: ../.env

services:
  postgres:
    image: postgres:16.9-alpine
    environment:
      POSTGRES_DB: kuuma
      POSTGRES_USER: kuuma
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
      AI_DB_PASSWORD: ${AI_DB_PASSWORD}
      COMPANION_DB_PASSWORD: ${COMPANION_DB_PASSWORD}
      CASEFILE_DB_PASSWORD: ${CASEFILE_DB_PASSWORD}
      GUARDIAN_DB_PASSWORD: ${GUARDIAN_DB_PASSWORD}
    volumes:
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/10-schemas.sh:ro
      - pgdata:/var/lib/postgresql/data
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kuuma -d kuuma"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7.4.3-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes: [miniodata:/data]
    ports: ["9000:9000", "9001:9001"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 10

  # One-shot: create the buckets the stubs' sample URLs point at.
  minio-buckets:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      sh -c "mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
             mc mb --ignore-existing local/kuuma-artifacts local/kuuma-bundles"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    restart: "no"

  ai:
    <<: *service
    environment:
      APP: kuuma_ai_service.app:app
      SERVICE_DIR: ai/service
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL_AI: postgresql+psycopg://ai_svc:${AI_DB_PASSWORD}@postgres:5432/kuuma

  companion:
    <<: *service
    environment:
      APP: kuuma_companion_service.app:app
      SERVICE_DIR: modules/companion/service
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL_COMPANION: postgresql+psycopg://companion_svc:${COMPANION_DB_PASSWORD}@postgres:5432/kuuma

  casefile:
    <<: *service
    environment:
      APP: kuuma_casefile_service.app:app
      SERVICE_DIR: modules/casefile/service
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL_CASEFILE: postgresql+psycopg://casefile_svc:${CASEFILE_DB_PASSWORD}@postgres:5432/kuuma

  guardian:
    <<: *service
    environment:
      APP: kuuma_guardian_service.app:app
      SERVICE_DIR: modules/guardian/service
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL_GUARDIAN: postgresql+psycopg://guardian_svc:${GUARDIAN_DB_PASSWORD}@postgres:5432/kuuma

  gateway:
    image: nginx:1.27.5-alpine
    depends_on:
      ai: { condition: service_healthy }
      companion: { condition: service_healthy }
      casefile: { condition: service_healthy }
      guardian: { condition: service_healthy }
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    ports: ["8080:8080"]

volumes:
  pgdata:
  miniodata:
