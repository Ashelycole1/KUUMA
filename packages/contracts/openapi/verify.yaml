openapi: 3.1.0
info:
  title: Kuuma Verify API
  version: 1.0.0
  description: |
    Owned by the Casefile build. Public: a school, police officer or lawyer checks that
    an evidence hash was timestamped and that its chain is intact. No auth.
servers:
  - url: http://localhost:8080
paths:
  /v1/verify/{hash}:
    get:
      operationId: verifyHash
      summary: Check an evidence hash.
      security: []
      parameters:
        - name: hash
          in: path
          required: true
          schema: { $ref: "../schemas/types/sha256.json" }
          example: c5bf1e54aa40f41226e9d2f6ab25a1c41aa5cb53e65f1f338fd6cd2d738d35a6
      responses:
        "200":
          description: Verification result.
          content:
            application/json:
              schema: { $ref: "../schemas/api/verify-response.json" }
              example:
                hash: c5bf1e54aa40f41226e9d2f6ab25a1c41aa5cb53e65f1f338fd6cd2d738d35a6
                found: true
                timestamp: "2026-11-05T09:30:00Z"
                chainValid: true
        default: { $ref: "#/components/responses/Error" }
  /v1/verify/shares/{requestId}:
    get:
      operationId: getShare
      summary: Download link for a shared, encrypted case bundle (the key is in the share link's fragment).
      security: []
      parameters:
        - name: requestId
          in: path
          required: true
          schema: { $ref: "../schemas/types/uuid.json" }
          example: e1d2c3b4-a5f6-4e7d-9c8b-7a6f5e4d3c2b
      responses:
        "200":
          description: The share is live.
          content:
            application/json:
              schema: { $ref: "../schemas/api/share-download.json" }
              example:
                requestId: e1d2c3b4-a5f6-4e7d-9c8b-7a6f5e4d3c2b
                bundleHash: e5704e345ba042f43d7b567d99c7a335469806e7f1e711526ccb3587d8b22d61
                downloadUrl: http://localhost:9000/kuuma-bundles/d4e5f6a7-b8c9-4d0e-8f1a-2b3c4d5e6f7a
                expiresAt: "2026-12-05T09:30:00Z"
        default: { $ref: "#/components/responses/Error" }
components:
  responses:
    Error:
      description: Any error.
      content:
        application/json:
          schema: { $ref: "../schemas/types/error-response.json" }
          example: { error: { code: bad_request, message: Invalid hash, requestId: req-0000 } }
