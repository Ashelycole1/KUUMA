openapi: 3.1.0
info:
  title: Kuuma Guardian API
  version: 1.1.0
  description: |
    Owned by the Guardian build. Child-phone endpoints are device-signed (deviceSignature).
    Parent endpoints use the parent session token from POST /v1/guardian/parents (parentSession).
    Policies and approval decisions are signed by the parent's phone with the family key, which
    travels only in the pairing QR code: the server can neither read nor forge them.
servers:
  - url: http://localhost:8080
security:
  - deviceSignature: []
paths:
  /v1/guardian/parents:
    post:
      operationId: registerParent
      summary: Create a parent account tied to a random ID and bound to this phone's key.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../schemas/api/parent-registration-request.json" }
            example: { devicePublicKey: TUZrd0V3WUhLb1pJemowQ0FRWUlLb1pJemowREFRY0RRZ0FF }
      responses:
        "201":
          description: The account.
          content:
            application/json:
              schema: { $ref: "../schemas/api/parent-registration-response.json" }
              example: { parentId: 9b8c7d6e-5f4a-4b3c-8d2e-1f0a9b8c7d6e, sessionToken: test-parent-session-token-0000000000 }
        default: { $ref: "#/components/responses/Error" }
  /v1/guardian/pairing-codes:
    post:
      operationId: createPairingCode
      summary: Start adding a child. The QR code the parent app shows holds this code and the family key.
      security:
        - parentSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../schemas/api/pairing-code-request.json" }
            example: { policy: &policy
                { ageBracket: age_placeholder_b, watchedApps: [whatsapp, sms],
                  thresholds: { flagMinConfidence: 0.6, alertMinSeverity: medium, captureMinSeverity: medium },
                  policyVersion: 1, signature: wIb_NLyPXQ2pLw0INOBonUMMH7KFQumUTf8WGWpB93A } }
      responses:
        "201":
          description: A one-time pairing code, valid for 15 minutes.
          content:
            application/json:
              schema: { $ref: "../schemas/api/pairing-code-response.json" }
              example: { childId: 3f1c6a2e-8b7d-4c1e-9a2b-1d2e3f4a5b6c, pairingCode: "482913", expiresAt: "2026-11-05T09:45:00Z" }
        default: { $ref: "#/components/responses/Error" }
  /v1/guardian/pairings:
    post:
      operationId: createPairing
      summary: The child's phone redeems the pairing code and registers its device key.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../schemas/api/pairing-request.json" }
            example: { pairingCode: "482913", devicePublicKey: TUZrd0V3WUhLb1pJemowQ0FRWUlLb1pJemowREFRY0RRZ0FF, ageBracket: age_placeholder_b }
      responses:
        "201":
          description: Paired.
          content:
            application/json:
              schema: { $ref: "../schemas/api/pairing-response.json" }
              example:
                childId: 3f1c6a2e-8b7d-4c1e-9a2b-1d2e3f4a5b6c
                deviceId: 7a9e2c41-5d3b-4f6a-8e1c-2b3d4e5f6a7b
                policy: *policy
        default: { $ref: "#/components/responses/Error" }
  /v1/guardian/children:
    get:
      operationId: listChildren
      summary: The signed-in parent's children, with protection status.
      security:
        - parentSession: []
      responses:
        "200":
          description: Children.
          content:
            application/json:
              schema: { $ref: "../schemas/api/child-list.json" }
              example:
                children:
                  - { childId: 3f1c6a2e-8b7d-4c1e-9a2b-1d2e3f4a5b6c, paired: true, ageBracket: age_placeholder_b, policyVersion: 1,
                      lastHeartbeatAt: "2026-11-05T09:30:00Z", protectionActive: true, missingPermissions: [] }
        default: { $ref: "#/components/responses/Error" }
  /v1/guardian/children/{childId}/policy:
    put:
      operationId: putPolicy
      summary: Replace a child's policy (a newer, parent-signed version).
      security:
        - parentSession: []
      parameters:
        - name: childId
          in: path
          required: true
          schema: { $ref: "../schemas/types/uuid.json" }
          example: 3f1c6a2e-8b7d-4c1e-9a2b-1d2e3f4a5b6c
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../schemas/types/policy.json" }
            example: *policy
      responses:
        "200":
          description: The stored policy.
          content:
            application/json:
              schema: { $ref: "../schemas/types/policy.json" }
              example: *policy
        default: { $ref: "#/components/responses/Error" }
  /v1/guardian/alerts:
    post:
      operationId: createAlert
      summary: The child's phone raises an alert. Only summary fields, plus an excerpt the server cannot read.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../schemas/api/alert-request.json" }
            example: { caseId: c0a5e1d2-3b4c-4d5e-8f6a-7b8c9d0e1f2a, severity: high, category: threat, kind: flag, appSource: whatsapp,
                       occurredAt: "2026-11-05T09:30:00Z", sealedExcerpt: 2xe1KPnJyC1COJEUWY1q7PMR8pG4e7wkcCRg_4RNW-jsl5QnWXGDXUA3vFN_0DzBfG_IQYwq2mzRDNSs }
      responses:
        "201":
          description: The alert.
          content:
            application/json:
              schema: { $ref: "../schemas/types/alert.json" }
              example: &alert
                alertId: a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d
                caseId: c0a5e1d2-3b4c-4d5e-8f6a-7b8c9d0e1f2a
                childId: 3f1c6a2e-8b7d-4c1e-9a2b-1d2e3f4a5b6c
                kind: flag
                severity: high
                category: threat
                appSource: whatsapp
                occurredAt: "2026-11-05T09:30:00Z"
                sealedExcerpt: 2xe1KPnJyC1COJEUWY1q7PMR8pG4e7wkcCRg_4RNW-jsl5QnWXGDXUA3vFN_0DzBfG_IQYwq2mzRDNSs
                createdAt: "2026-11-05T09:31:00Z"
                read: false
        default: { $ref: "#/components/responses/Error" }
    get:
      operationId: listAlerts
      summary: Alerts for the signed-in parent, newest first.
      security:
        - parentSession: []
      responses:
        "200":
          description: Alerts.
          content:
            application/json:
              schema: { $ref: "../schemas/api/alert-list.json" }
              example: { alerts: [*alert] }
        default: { $ref: "#/components/responses/Error" }
  /v1/guardian/approval-requests:
    post:
      operationId: createApprovalRequest
      summary: The child's phone asks the parent to approve a share or deletion.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../schemas/api/approval-request.json" }
            example: { requestId: e1d2c3b4-a5f6-4e7d-9c8b-7a6f5e4d3c2b, caseId: c0a5e1d2-3b4c-4d5e-8f6a-7b8c9d0e1f2a, kind: share, recipientType: school }
      responses:
        "201":
          description: The pending approval.
          content:
            application/json:
              schema: { $ref: "../schemas/api/approval.json" }
              example: &approval
                approvalId: b2c3d4e5-f6a7-4b8c-9d0e-1f2a3b4c5d6e
                requestId: e1d2c3b4-a5f6-4e7d-9c8b-7a6f5e4d3c2b
                caseId: c0a5e1d2-3b4c-4d5e-8f6a-7b8c9d0e1f2a
                kind: share
                recipientType: school
                status: pending
                createdAt: "2026-11-05T09:35:00Z"
        default: { $ref: "#/components/responses/Error" }
  /v1/guardian/approvals:
    get:
      operationId: listApprovals
      summary: Approval requests for the signed-in parent's children, newest first.
      security:
        - parentSession: []
      responses:
        "200":
          description: Approvals.
          content:
            application/json:
              schema: { $ref: "../schemas/api/approval-list.json" }
              example: { approvals: [*approval] }
        default: { $ref: "#/components/responses/Error" }
  /v1/guardian/approvals/{approvalId}:
    post:
      operationId: decideApproval
      summary: Approve or decline, signed by the parent's phone.
      security:
        - parentSession: []
      parameters:
        - name: approvalId
          in: path
          required: true
          schema: { $ref: "../schemas/types/uuid.json" }
          example: b2c3d4e5-f6a7-4b8c-9d0e-1f2a3b4c5d6e
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../schemas/api/approval-decision-request.json" }
            example: { decision: approve, signature: TAVpvYY4LMEAlnUjOS7RVFpnPmvTf2VRd1Dv7ARBZgE }
      responses:
        "200":
          description: The decision.
          content:
            application/json:
              schema: { $ref: "../schemas/api/approval-result.json" }
              example:
                approvalId: b2c3d4e5-f6a7-4b8c-9d0e-1f2a3b4c5d6e
                requestId: e1d2c3b4-a5f6-4e7d-9c8b-7a6f5e4d3c2b
                caseId: c0a5e1d2-3b4c-4d5e-8f6a-7b8c9d0e1f2a
                kind: share
                decision: approve
                decidedAt: "2026-11-05T09:40:00Z"
                signature: TAVpvYY4LMEAlnUjOS7RVFpnPmvTf2VRd1Dv7ARBZgE
        default: { $ref: "#/components/responses/Error" }
  /v1/guardian/heartbeat:
    post:
      operationId: heartbeat
      summary: The child's phone checks in, reports missing permissions, and collects policy and decisions.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../schemas/api/heartbeat-request.json" }
            example: { deviceId: 7a9e2c41-5d3b-4f6a-8e1c-2b3d4e5f6a7b, appVersion: 0.1.0, policyVersion: 1, protectionActive: true, missingPermissions: [] }
      responses:
        "200":
          description: Latest policy version, a newer policy if any, and undelivered decisions.
          content:
            application/json:
              schema: { $ref: "../schemas/api/heartbeat-response.json" }
              example: { latestPolicyVersion: 1, serverTime: "2026-11-05T09:30:00Z", decisions: [] }
        default: { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    deviceSignature: { type: apiKey, in: header, name: X-Kuuma-Signature }
    parentSession: { type: http, scheme: bearer, description: Session token from POST /v1/guardian/parents. }
  responses:
    Error:
      description: Any error.
      content:
        application/json:
          schema: { $ref: "../schemas/types/error-response.json" }
          example: { error: { code: bad_request, message: Invalid body, requestId: req-0000 } }
