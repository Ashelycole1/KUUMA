openapi: 3.1.0
info:
  title: Kuuma Guardian API
  version: 1.0.0
  description: Owned by the Guardian build. Parent-facing endpoints use a parent session (placeholder until login is built).
servers:
  - url: http://localhost:8080
security:
  - deviceSignature: []
paths:
  /v1/guardian/pairings:
    post:
      operationId: createPairing
      summary: Pair a child device using the code shown in the parent app.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../schemas/api/pairing-request.json" }
            example: { pairingCode: "482913", devicePublicKey: TUZrd0V3WUhLb1pJemowQ0FRWUlLb1pJemowREFRY0RRZ0FF, ageBracket: age_placeholder_b }
      responses:
        "201":
          description: Paired.
          content:
            application/json:
              schema: { $ref: "../schemas/api/pairing-response.json" }
              example:
                childId: 3f1c6a2e-8b7d-4c1e-9a2b-1d2e3f4a5b6c
                deviceId: 7a9e2c41-5d3b-4f6a-8e1c-2b3d4e5f6a7b
                policy: &policy
                  ageBracket: age_placeholder_b
                  watchedApps: [whatsapp, sms]
                  thresholds: { flagMinConfidence: 0.6, alertMinSeverity: medium, captureMinSeverity: medium }
                  policyVersion: 1
        default: { $ref: "#/components/responses/Error" }
  /v1/guardian/children/{childId}/policy:
    put:
      operationId: putPolicy
      summary: Replace a child's policy.
      security:
        - parentSession: []
      parameters:
        - name: childId
          in: path
          required: true
          schema: { $ref: "../schemas/types/uuid.json" }
          example: 3f1c6a2e-8b7d-4c1e-9a2b-1d2e3f4a5b6c
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../schemas/types/policy.json" }
            example: *policy
      responses:
        "200":
          description: The stored policy.
          content:
            application/json:
              schema: { $ref: "../schemas/types/policy.json" }
              example: *policy
        default: { $ref: "#/components/responses/Error" }
  /v1/guardian/alerts:
    post:
      operationId: createAlert
      summary: Raise an alert for the paired parent (called on case escalation).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../schemas/api/alert-request.json" }
            example: { caseId: c0a5e1d2-3b4c-4d5e-8f6a-7b8c9d0e1f2a, severity: high, category: threat }
      responses:
        "201":
          description: The alert.
          content:
            application/json:
              schema: { $ref: "../schemas/types/alert.json" }
              example: &alert
                alertId: a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d
                caseId: c0a5e1d2-3b4c-4d5e-8f6a-7b8c9d0e1f2a
                severity: high
                category: threat
                createdAt: "2026-11-05T09:31:00Z"
                read: false
        default: { $ref: "#/components/responses/Error" }
    get:
      operationId: listAlerts
      summary: Alerts for the signed-in parent, newest first.
      security:
        - parentSession: []
      responses:
        "200":
          description: Alerts.
          content:
            application/json:
              schema: { $ref: "../schemas/api/alert-list.json" }
              example: { alerts: [*alert] }
        default: { $ref: "#/components/responses/Error" }
  /v1/guardian/approvals/{approvalId}:
    post:
      operationId: decideApproval
      summary: Approve or decline a share request.
      security:
        - parentSession: []
      parameters:
        - name: approvalId
          in: path
          required: true
          schema: { $ref: "../schemas/types/uuid.json" }
          example: b2c3d4e5-f6a7-4b8c-9d0e-1f2a3b4c5d6e
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../schemas/api/approval-decision-request.json" }
            example: { decision: approve }
      responses:
        "200":
          description: The decision.
          content:
            application/json:
              schema: { $ref: "../schemas/api/approval-result.json" }
              example:
                approvalId: b2c3d4e5-f6a7-4b8c-9d0e-1f2a3b4c5d6e
                requestId: e1d2c3b4-a5f6-4e7d-9c8b-7a6f5e4d3c2b
                caseId: c0a5e1d2-3b4c-4d5e-8f6a-7b8c9d0e1f2a
                decision: approve
                decidedAt: "2026-11-05T09:40:00Z"
        default: { $ref: "#/components/responses/Error" }
  /v1/guardian/heartbeat:
    post:
      operationId: heartbeat
      summary: The child device reports it is alive and protection is on.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../schemas/api/heartbeat-request.json" }
            example: { deviceId: 7a9e2c41-5d3b-4f6a-8e1c-2b3d4e5f6a7b, appVersion: 0.1.0, policyVersion: 1, protectionActive: true }
      responses:
        "200":
          description: Latest policy version, so the phone knows whether to refresh.
          content:
            application/json:
              schema: { $ref: "../schemas/api/heartbeat-response.json" }
              example: { latestPolicyVersion: 1, serverTime: "2026-11-05T09:30:00Z" }
        default: { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    deviceSignature: { type: apiKey, in: header, name: X-Kuuma-Signature }
    parentSession: { type: http, scheme: bearer, description: PLACEHOLDER parent session token until login is built. }
  responses:
    Error:
      description: Any error.
      content:
        application/json:
          schema: { $ref: "../schemas/types/error-response.json" }
          example: { error: { code: bad_request, message: Invalid body, requestId: req-0000 } }
