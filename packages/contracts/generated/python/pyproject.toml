[project]
name = "kuuma-contracts"
version = "1.0.0"
description = "Nilinde contract types and contract-test harness (generated)."
requires-python = ">=3.12"
dependencies = ["pydantic==2.11.4", "jsonschema==4.23.0"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kuuma_contracts"]
