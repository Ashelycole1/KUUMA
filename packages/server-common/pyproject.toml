[project]
name = "kuuma-server-common"
version = "0.1.0"
description = "Shared base for Nilinde Python services: app factory, auth, safe logging, DB, Redis Streams."
requires-python = ">=3.12"
dependencies = [
  "kuuma-contracts",
  "fastapi==0.115.12",
  "uvicorn[standard]==0.34.2",
  "pydantic==2.11.4",
  "sqlalchemy==2.0.40",
  "alembic==1.15.2",
  "psycopg[binary]==3.2.9",
  "redis==5.2.1",
  "cryptography==44.0.3",
  "prometheus-client==0.21.1",
  "pyyaml==6.0.2",
]

[tool.uv.sources]
kuuma-contracts = { workspace = true }

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kuuma_server_common"]
