[project]
name = "kuuma-llm"
version = "0.0.1"
description = "Model clients (Sunflower via a local Ollama), prompt registry, scrubbing guard and cache."
requires-python = ">=3.12"
dependencies = ["httpx==0.28.1", "pyyaml==6.0.2"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kuuma_llm"]
